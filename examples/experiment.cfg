\ Параметры численного эксперимента
var points = ^{pow 2 10}
var dt = 1e-3
$[
  experiment : q(pendulum),
  notes : q(Проверка сохранения энергии),
  solver : $[
    method : q(runge_kutta_4),
    steps : ^{points},
    step_size : ^{dt},
    tolerance : 1e-9
  ],
  pendulum : $[
    length_m : 1.25,
    gravity : 9.81,
    initial_angle_rad : 0.35
  ],
  output : $[
    dir : q(results/pendulum),
    format : q(csv),
    every_n_steps : 16
  ]
]