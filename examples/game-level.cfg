\ Описание уровня игры
var tile = 32
var width = 40
var height = 25
$[
  level : q(forest_01),
  music : q(forest_theme.ogg),
  size : $[
    width_px : {* tile width},
    height_px : {* tile height}
  ],
  player : $[
    name : q(ranger),
    speed : 4.5,
    start : $[ x : 3, y : 17 ]
  ],
  enemies : $[
    count : 12,
    boss : $[
      hp : {pow 2 8},
      damage : {/ 100 8}
    ]
  ]
]