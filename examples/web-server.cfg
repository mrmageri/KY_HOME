\ Конфигурация веб-сервера
var default_port = 8080
var timeout_sec = 30
$[
  app : q(gateway),
  port : default_port,
  timeout : timeout_sec,
  host : q(0.0.0.0),
  tls : $[
    enabled : 1,
    cert : q(/etc/ssl/server.crt),
    key : q(/etc/ssl/server.key)
  ],
  logging : $[
    level : q(info),
    file : q(/var/log/gateway.log),
    rotate_days : 7
  ],
  limits : $[
    max_conn : {* 2 5000},
    max_body_mb : 64
  ]
]